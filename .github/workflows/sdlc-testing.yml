name: SDLC Gate G6 - Testing

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number this test run relates to"
        required: true
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  testing-gate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null && contains(github.event.comment.body, '/sdlc-testing'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        working-directory: task-tracker-lite
        run: npm run install:all

      - name: Install Playwright browsers
        working-directory: task-tracker-lite/e2e
        run: npm run install:browsers

      - name: Run SDLC Testing gate via Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Use the sdlc-testing skill for pull request #${{ steps.pr.outputs.number }}
            in NeerajKumarEpam/EpamTestRepo. Follow the skill's task and output contract
            exactly, then print the required JSON gate block.
          allowed_tools: "Bash,Read,Grep,Glob"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATLASSIAN_SITE_URL: ${{ secrets.ATLASSIAN_SITE_URL }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: task-tracker-lite/e2e/playwright-report/
          retention-days: 30
